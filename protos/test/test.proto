syntax = "proto3";

package testpb;

option go_package = "github.com/tochemey/ego/v5/test/data/testpb;testpb";

message TestReply {}
message TestPanic {}
message TestTimeout {}
message Reply {
  string content = 1;
}

message TestSend {}

message Account {
  string account_id = 1;
  double account_balance = 2;
}

message CreateAccount {
  double account_balance = 2;
}

message CreditAccount {
  string account_id = 1;
  double balance = 2;
}

message AccountCreated {
  string account_id = 1;
  double account_balance = 2;
}

message AccountCredited {
  string account_id = 1;
  double account_balance = 2;
}

message TestNoEvent {}
